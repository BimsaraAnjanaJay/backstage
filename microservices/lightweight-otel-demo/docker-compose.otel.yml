services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger-lightweight
    ports:
      - 16686:16686
      - 4317:4317
      - 4318:4318
    networks:
      - otel-net
  gateway:
    build: .
    command: npm run start:gateway
    container_name: gateway-service
    environment:
      - PORT=8080
      - AUTH_URL=http://auth:8081
      - PRODUCT_URL=http://product:8082
      - OTEL_SERVICE_NAME=gateway-service
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
    ports:
      - 8080:8080
    depends_on:
      - auth
      - product
      - jaeger
    networks:
      - otel-net
  auth:
    build: .
    command: npm run start:auth
    container_name: auth-service
    environment:
      - PORT=8081
      - OTEL_SERVICE_NAME=auth-service
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
    ports:
      - 8081:8081
    depends_on:
      - jaeger
    networks:
      - otel-net
  product:
    build: .
    command: npm run start:product
    container_name: product-service
    environment:
      - PORT=8082
      - OTEL_SERVICE_NAME=product-service
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
    ports:
      - 8082:8082
    depends_on:
      - jaeger
    networks:
      - otel-net
networks:
  otel-net:
    driver: bridge
