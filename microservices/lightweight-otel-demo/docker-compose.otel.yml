services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - 16686:16686
      - 4318:4318
      - 4317:4317
      - 14268:14268
      - 9411:9411
    networks:
      - microservices
  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    image: auth:latest
    container_name: auth
    environment:
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_SERVICE_NAME=auth
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_NODE_RESOURCE_DETECTORS=env,host,os,process
    ports:
      - 8080:8080
    depends_on:
      - jaeger
    networks:
      - microservices
    command: sh -c "npm install && npm install --no-save @opentelemetry/api @opentelemetry/auto-instrumentations-node @opentelemetry/sdk-node && node --require @opentelemetry/auto-instrumentations-node/register index.js"
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: gateway:latest
    container_name: gateway
    environment:
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_SERVICE_NAME=gateway
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_NODE_RESOURCE_DETECTORS=env,host,os,process
    ports:
      - 8081:8081
    depends_on:
      - jaeger
    networks:
      - microservices
    command: sh -c "npm install && npm install --no-save @opentelemetry/api @opentelemetry/auto-instrumentations-node @opentelemetry/sdk-node && node --require @opentelemetry/auto-instrumentations-node/register index.js"
  product:
    build:
      context: ./product
      dockerfile: Dockerfile
    image: product:latest
    container_name: product
    environment:
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_SERVICE_NAME=product
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_NODE_RESOURCE_DETECTORS=env,host,os,process
    ports:
      - 8082:8082
    depends_on:
      - jaeger
    networks:
      - microservices
    command: sh -c "npm install && npm install --no-save @opentelemetry/api @opentelemetry/auto-instrumentations-node @opentelemetry/sdk-node && node --require @opentelemetry/auto-instrumentations-node/register index.js"
networks:
  microservices:
    driver: bridge
