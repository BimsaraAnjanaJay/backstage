apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: opentelemetry-astronomy-shop
  title: OpenTelemetry Astronomy Shop
  description: Multi-language microservices demo with distributed tracing
  annotations:
    jaeger.io/service-name: astronomy-shop
    jaeger.io/endpoint: http://localhost:32771
spec:
  owner: platform-team
  domain: ecommerce
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: otel-frontend
  title: OpenTelemetry Frontend Service
  description: Node.js/TypeScript frontend application (OpenTelemetry Demo)
  annotations:
    jaeger.io/service-name: frontend
    jaeger.io/endpoint: http://localhost:32771
    backstage.io/techdocs-ref: dir:.
spec:
  type: service
  lifecycle: production
  owner: frontend-team
  system: opentelemetry-astronomy-shop
  providesApis:
    - frontend-api
  dependsOn:
    - component:otel-checkout
    - component:otel-cart
    - component:otel-product-catalog
    - component:otel-recommendation
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: otel-checkout
  title: OpenTelemetry Checkout Service
  description: Go-based checkout service with function-level tracing
  annotations:
    jaeger.io/service-name: checkout
    jaeger.io/endpoint: http://localhost:32771
    github.com/project-slug: open-telemetry/opentelemetry-demo
spec:
  type: service
  lifecycle: production
  owner: checkout-team
  system: opentelemetry-astronomy-shop
  providesApis:
    - checkout-api
  dependsOn:
    - component:otel-cart
    - component:otel-product-catalog
    - component:otel-currency
    - component:otel-shipping
    - component:otel-payment
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: otel-cart
  title: OpenTelemetry Cart Service
  description: Go-based cart service with Redis backend
  annotations:
    jaeger.io/service-name: cart
    jaeger.io/endpoint: http://localhost:32771
spec:
  type: service
  lifecycle: production
  owner: cart-team
  system: opentelemetry-astronomy-shop
  providesApis:
    - cart-api
  dependsOn:
    - resource:valkey-cart
---
apiVersion: backstage.io/v1alpha1
