apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: valkey-cart
  title: Cart Database
  description: Valkey/Redis database for cart storage
spec:
  type: database
  owner: platform-team
  system: opentelemetry-astronomy-shop
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: jaeger-tracing
  title: Jaeger Distributed Tracing
  description: Jaeger instance for distributed tracing collection and visualization
  annotations:
    jaeger.io/endpoint: http://localhost:32771
spec:
  type: tracing
  owner: platform-team
  system: opentelemetry-astronomy-shop
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: frontend-api
  title: Frontend API
  description: REST API for the frontend application
spec:
  type: openapi
  lifecycle: production
  owner: frontend-team
  system: opentelemetry-astronomy-shop
  definition: |
    openapi: 3.0.0
    info:
      title: Frontend API
      version: 1.0.0
    paths:
      /api/products:
        get:
          summary: Get all products
      /api/cart:
        post:
          summary: Add item to cart
      /api/checkout:
        post:
          summary: Process checkout
