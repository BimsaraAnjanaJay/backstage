apiVersion: v1
kind: ServiceAccount
metadata:
  name: jaeger
  namespace: observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-all-in-one
  namespace: observability
  labels:
    app: jaeger
    component: all-in-one
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
      component: all-in-one
  template:
    metadata:
      labels:
        app: jaeger
        component: all-in-one
    spec:
      serviceAccountName: jaeger
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.51
        ports:
          # Agent ports
          - containerPort: 5775
            protocol: UDP
            name: zipkin-compact
          - containerPort: 6831
            protocol: UDP
            name: jaeger-compact
          - containerPort: 6832
            protocol: UDP
            name: jaeger-binary
          - containerPort: 5778
            protocol: TCP
            name: config-rest
          # Collector ports
          - containerPort: 14268
            protocol: TCP
            name: jaeger-http
          - containerPort: 14250
            protocol: TCP
            name: jaeger-grpc
          - containerPort: 9411
            protocol: TCP
            name: zipkin
          # Query/UI port
          - containerPort: 16686
            protocol: TCP
            name: query-ui
          # Admin port
          - containerPort: 14269
            protocol: TCP
            name: admin
        env:
          # Memory storage configuration
          - name: COLLECTOR_ZIPKIN_HOST_PORT
            value: ":9411"
          - name: SPAN_STORAGE_TYPE
            value: "memory"
          - name: MEMORY_MAX_TRACES
            value: "100000"
          # Query configuration
          - name: QUERY_BASE_PATH
            value: "/jaeger"
          - name: QUERY_UI_CONFIG
            value: |
              {
                "dependencies": {
                  "menuEnabled": true
                },
                "archiveEnabled": true,
                "tracking": {
                  "gaID": ""
                },
                "menu": [
                  {
                    "label": "Backstage",
                    "items": [
                      {
                        "label": "Function Analytics",
                        "url": "http://localhost:3000/function-analytics"
                      }
                    ]
                  }
                ]
              }
          # Sampling configuration
          - name: SAMPLING_STRATEGIES_FILE
            value: "/etc/jaeger/sampling.json"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 14269
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 14269
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
          - name: sampling-config
            mountPath: /etc/jaeger
      volumes:
        - name: sampling-config
          configMap:
            name: jaeger-sampling-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-sampling-config
  namespace: observability
data:
  sampling.json: |
    {
      "service_strategies": [
        {
          "service": "user-service",
          "type": "probabilistic",
          "param": 1.0
        },
        {
          "service": "product-service",
          "type": "probabilistic",
          "param": 1.0
        },
        {
          "service": "order-service",
          "type": "probabilistic",
          "param": 1.0
        }
      ],
      "default_strategy": {
        "type": "probabilistic",
        "param": 0.5
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: observability
  labels:
    app: jaeger
    component: collector
spec:
  ports:
    - name: jaeger-http
      port: 14268
      targetPort: 14268
      protocol: TCP
    - name: jaeger-grpc
      port: 14250
      targetPort: 14250
      protocol: TCP
    - name: zipkin
      port: 9411
      targetPort: 9411
      protocol: TCP
  selector:
    app: jaeger
    component: all-in-one
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: observability
  labels:
    app: jaeger
    component: query
spec:
  ports:
    - name: query-ui
      port: 16686
      targetPort: 16686
      protocol: TCP
  selector:
    app: jaeger
    component: all-in-one
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-agent
  namespace: observability
  labels:
    app: jaeger
    component: agent
spec:
  ports:
    - name: zipkin-compact
      port: 5775
      targetPort: 5775
      protocol: UDP
    - name: jaeger-compact
      port: 6831
      targetPort: 6831
      protocol: UDP
    - name: jaeger-binary
      port: 6832
      targetPort: 6832
      protocol: UDP
    - name: config-rest
      port: 5778
      targetPort: 5778
      protocol: TCP
  selector:
    app: jaeger
    component: all-in-one
  type: ClusterIP
