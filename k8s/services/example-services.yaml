apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: default
  labels:
    app: user-service
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        version: v1.0.0
        component: api
      annotations:
        # ✨ Enable Node.js auto-instrumentation
        instrumentation.opentelemetry.io/inject-nodejs: "observability/auto-instrumentation"
        # Optional: Inject collector as sidecar
        sidecar.opentelemetry.io/inject: "true"
    spec:
      containers:
      - name: user-service
        image: your-registry/user-service:latest
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        # Service identification
        - name: SERVICE_NAME
          value: "user-service"
        - name: SERVICE_VERSION
          value: "1.0.0"
        - name: ENVIRONMENT
          value: "production"
        
        # OpenTelemetry configuration (auto-populated by operator)
        - name: OTEL_SERVICE_NAME
          value: "user-service"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=user-service,service.namespace=default,service.version=1.0.0,microserviceType=api"
        
        # Application configuration
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: default
  labels:
    app: user-service
spec:
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: user-service
  type: ClusterIP
---
