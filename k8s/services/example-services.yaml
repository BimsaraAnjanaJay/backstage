apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: default
  labels:
    app: order-service
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        version: v1.0.0
        component: api
      annotations:
        # ✨ Enable Java auto-instrumentation
        instrumentation.opentelemetry.io/inject-java: "observability/auto-instrumentation"
        sidecar.opentelemetry.io/inject: "true"
    spec:
      containers:
      - name: order-service
        image: your-registry/order-service:latest
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: SERVICE_NAME
          value: "order-service"
        - name: SERVICE_VERSION
          value: "1.0.0"
        - name: ENVIRONMENT
          value: "production"
        
        # OpenTelemetry configuration
        - name: OTEL_SERVICE_NAME
          value: "order-service"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=order-service,service.namespace=default,service.version=1.0.0,microserviceType=api"
        
        # External service URLs (for cross-service calls)
        - name: USER_SERVICE_URL
          value: "http://user-service.default.svc.cluster.local"
        - name: PRODUCT_SERVICE_URL
          value: "http://product-service.default.svc.cluster.local"
        
        # Java configuration
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m"
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "300m"
          limits:
            memory: "1Gi"
            cpu: "700m"
        
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: default
  labels:
    app: order-service
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: order-service
  type: ClusterIP
